[package]
name = "bkn-proxy"
version = "0.1.0"
edition = "2024"
description = "Desktop app that routes the whole device through a SOCKS5 proxy"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
gpui-kit = "0.10"
tun2proxy = { version = "0.8", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
keyring = "4"
rand = "0.10"
log = "0.4"
sys-locale = "0.3"
dirs = "6"
aws-lc-rs = "1"
base64 = "0.22"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.10", features = ["test-support"] }

# Only for the offscreen screenshot test: a text system that, unlike the full
# macOS platform, can be created off the main thread.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12" }
