# Builds the desktop app for macOS and Windows and publishes a GitHub release
# when a tag like v0.2.0 is pushed. The app's version comes from Cargo.toml and
# must match the tag.
#
# Repository secrets:
#   BKN_API_URL              the server the app talks to, e.g. https://example.com
#   BKN_UPDATE_KEY           public half of the update key (base64, 32 bytes)
#   UPDATE_SIGNING_KEY       private half, PEM (see scripts/release-manifest.sh)
#   APPLE_CERTIFICATE_P12    Developer ID Application certificate, base64 of the .p12
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGN_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_P8         App Store Connect API key for notarization, the .p8 text
#   APPLE_API_KEY_ID
#   APPLE_API_ISSUER
#
# Windows code signing (SignPath Foundation, free for open source) is off until
# the repository has the variable SIGNPATH_ORGANIZATION_ID; then tagged builds
# are signed, and each of the two requests waits for an approval in SignPath:
#   SIGNPATH_ORGANIZATION_ID  repository variable, the SignPath organization's id
#   SIGNPATH_API_TOKEN        secret, a SignPath user who may submit requests
# The SignPath project is "bkn-proxy" with the policy "release-signing" and
# this default artifact configuration (a GitHub artifact is a zip):
#   <artifact-configuration xmlns="http://signpath.io/artifact-configuration/v1">
#     <zip-file><pe-file path="bkn-proxy*.exe"><authenticode-sign/></pe-file></zip-file>
#   </artifact-configuration>
name: release

on:
  push:
    tags: ['v*']
  # A build without a release: Actions → release → Run workflow. Use it to
  # check the macOS and Windows builds before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon only: no Intel build
    steps:
      - uses: actions/checkout@v4
      - name: Import the signing certificate into a throwaway keychain
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build, sign and notarize
        env:
          BKN_API_URL: ${{ secrets.BKN_API_URL }}
          BKN_UPDATE_KEY: ${{ secrets.BKN_UPDATE_KEY }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          scripts/package-macos.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/bkn-proxy-macos-aarch64.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          BKN_API_URL: ${{ secrets.BKN_API_URL }}
          BKN_UPDATE_KEY: ${{ secrets.BKN_UPDATE_KEY }}
        run: cargo build --release --locked -p bkn-proxy
      # Signing, part one: the app itself, before it goes into the installer.
      - name: Upload the app for signing
        id: unsigned-app
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: target/release/bkn-proxy.exe
      - name: Sign the app
        if: steps.unsigned-app.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: bkn-proxy
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600 # a person approves it
          output-artifact-directory: signed
      - name: Build the installer with the wintun driver
        shell: pwsh
        run: |
          if (Test-Path signed/bkn-proxy.exe) { Copy-Item signed/bkn-proxy.exe target/release/ -Force }
          # wintun is the TUN driver the tunnel needs; its DLL is signed by WireGuard LLC.
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw "wintun.zip checksum mismatch: $hash" }
          Expand-Archive wintun.zip -DestinationPath .
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'bkn-proxy').version
          # Inno Setup comes with the runner image.
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source ?? "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Last in the step: its exit code is the step's.
          & $iscc "/DMyAppVersion=$version" scripts\installer.iss
      # Signing, part two: the installer.
      - name: Upload the installer for signing
        id: unsigned-installer
        if: steps.unsigned-app.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/bkn-proxy-windows-x86_64.exe
      - name: Sign the installer
        if: steps.unsigned-installer.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: bkn-proxy
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Take the signed installer
        if: steps.unsigned-installer.outcome == 'success'
        shell: pwsh
        run: Copy-Item signed/bkn-proxy-windows-x86_64.exe dist/ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/bkn-proxy-windows-x86_64.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # By name: the windows job may also hold the unsigned files it sent for signing.
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist
      - name: Check the tag matches the app version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bkn-proxy").version')
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Write and sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/release-manifest.sh "$VERSION" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md, without its heading.
          awk -v version="$VERSION" '/^## / { on = ($2 == version); next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
